    <main>
        <section class="viandas-intro">
            <h1>Nuestras viandas caseras</h1>
            <p>Elegi la vianda que mas te guste. Todas se preparan con ingredientes frescos del dia.</p>
        </section>

        <div class="movil">
            <div id="carouselExample" class="carousel slide" data-aos="fade-up">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="../assets/medallones-caseros-con-verduras.png" class="d-block w-100" alt="Viandas de medallones caseros con zanahoria, arvejas y huevo duro">
                    </div>
                    <div class="carousel-item">
                        <img src="../assets/viandas-croqueta-burger-albondiguitas.jpg" class="d-block w-100" alt="Menú de viandas: croqueta de acelga, burger de carne y albondiguitas estofadas">
                    </div>
                    <div class="carousel-item">
                        <img src="../assets/viandas-croqueta-pollo-salmon.jpg" class="d-block w-100" alt="Menú de viandas: croqueta de batata, pollo horneado con sésamo y salmón al horno">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExample"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>

        </div>

        <div class="escritorio">
            <section class="viandas" data-aos="zoom-in">

                <figure class="foto-vertical" tabindex="0">
                    <img src="../assets/medallones-caseros-con-verduras.png" alt="Viandas de medallones caseros con zanahoria, arvejas y huevo duro">
                    <figcaption>Vianda clasica</figcaption>
                </figure>

                <figure class="foto-cuadrada1" tabindex="0">
                    <img src="../assets/ensalada-de-lentejas-con-pollo.png" alt="Vianda de ensalada de lentejas con pollo, tomate, huevo y papas pay">
                    <figcaption>Vianda vegetariana</figcaption>
                </figure>

                <figure class="foto-cuadrada2" tabindex="0">
                    <img src="../assets/carne-con-pure.png" alt="Vianda de carne casera con puré">
                    <figcaption>Vianda kid</figcaption>
                </figure>

                <figure class="foto-horizontal" tabindex="0">
                    <img src="../assets/viandas-caseras-variadas.jpg" alt="Bandejas con viandas caseras variadas de verduras, pollo y tortilla">
                    <figcaption>Vianda familiar</figcaption>
                </figure>
